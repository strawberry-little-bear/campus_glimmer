{% extends 'base.html' %}

{% block title %}已退出登录 · 拾光校园{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card auth-card-compact">
        <div class="auth-logout">
            <span class="auth-logout-icon"><i class="bi bi-check2"></i></span>
            <span class="eyebrow eyebrow-soft">会话已安全结束</span>
            <h1>你已退出登录</h1>
            <p>感谢这次停留。下次回来时，你的心愿单、消息和交易记录仍会在原来的位置。</p>
            <div class="auth-logout-actions">
                <a href="{% url 'login' %}" class="btn btn-primary"><i class="bi bi-box-arrow-in-right me-2"></i>重新登录</a>
                <a href="{% url 'home' %}" class="btn btn-outline-primary"><i class="bi bi-house-door me-2"></i>返回首页</a>
            </div>
            <div class="auth-logout-note"><i class="bi bi-shield-check"></i> 如果这不是你的操作，请及时修改账户密码。</div>
        </div>
    </div>
</section>
{% endblock %}
