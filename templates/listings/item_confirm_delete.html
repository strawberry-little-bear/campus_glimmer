{% extends 'base.html' %}

{% block title %}删除商品 · 拾光校园{% endblock %}

{% block content %}
<div class="form-page-heading">
    <a href="{% url 'item_detail' item.id %}" class="back-link"><i class="bi bi-arrow-left me-2"></i>返回商品</a>
    <span class="eyebrow eyebrow-soft">Danger zone</span>
    <h1>确认删除商品</h1>
    <p>删除后无法恢复，请谨慎操作。</p>
</div>

<div class="form-card content-card confirm-card">
    <div class="confirm-icon"><i class="bi bi-exclamation-triangle"></i></div>
    <h2 class="confirm-title">确定要删除这件商品吗？</h2>
    <p class="confirm-subtitle">删除后你可以在「我的发布」里重新发布，但历史记录不会保留。</p>
    <div class="confirm-target">{{ item.title }}</div>
    <div class="confirm-warning">
        <i class="bi bi-info-circle me-2"></i><strong>此操作无法撤销：</strong>商品及相关评论、私信会话将被永久删除，已产生的订单与评价不受影响。如果只是想暂时下架，可以到商品页把状态改为「已预定」。
    </div>
    <form method="POST">
        {% csrf_token %}
        <div class="form-actions">
            <a href="{% url 'item_detail' item.id %}" class="btn btn-light">取消</a>
            <button type="submit" class="btn btn-danger px-4"><i class="bi bi-trash3 me-2"></i>确认删除</button>
        </div>
    </form>
</div>
{% endblock %}
