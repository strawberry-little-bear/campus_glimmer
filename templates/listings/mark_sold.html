{% extends 'base.html' %}

{% block title %}修改商品状态 · 拾光校园{% endblock %}

{% block content %}
<div class="form-page-heading">
    <a href="{% url 'item_detail' item.id %}" class="back-link"><i class="bi bi-arrow-left me-2"></i>返回商品</a>
    <span class="eyebrow eyebrow-soft">Listing status</span>
    <h1>修改商品状态</h1>
    <p>状态变更后，关注了这件商品的同学会收到提醒。</p>
</div>

<div class="form-card content-card">
    <div class="mark-sold-current">
        <h2>{{ item.title }}</h2>
        <p>当前状态：<span class="badge {% if item.status == 'available' %}bg-success{% elif item.status == 'reserved' %}bg-warning text-dark{% else %}bg-secondary{% endif %}">{{ item.get_status_display }}</span></p>
    </div>

    <form method="POST">
        {% csrf_token %}
        <div class="form-section">
            <h2><span>01</span>选择新状态</h2>
            <p class="text-muted small">与买家谈好后可以先设为「已预定」，收到款项后再改为「已售出」。</p>
            <div class="status-choice-list">
                <label class="status-choice">
                    <input class="form-check-input" type="radio" name="status" value="available" {% if item.status == 'available' %}checked{% endif %}>
                    <span class="status-choice-copy"><strong>可购买</strong><small>商品正常上架，可供购买</small></span>
                </label>
                <label class="status-choice">
                    <input class="form-check-input" type="radio" name="status" value="reserved" {% if item.status == 'reserved' %}checked{% endif %}>
                    <span class="status-choice-copy"><strong>已预定</strong><small>商品已有买家预定，暂不接受其他购买请求</small></span>
                </label>
                <label class="status-choice">
                    <input class="form-check-input" type="radio" name="status" value="sold" {% if item.status == 'sold' %}checked{% endif %}>
                    <span class="status-choice-copy"><strong>已售出</strong><small>商品已售出，不再显示在可购买列表中</small></span>
                </label>
            </div>
        </div>
        <div class="form-actions">
            <a href="{% url 'item_detail' item.id %}" class="btn btn-light">取消</a>
            <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check2 me-2"></i>保存更改</button>
        </div>
    </form>
</div>
{% endblock %}
