name: Django CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5
      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: Python 语法检查
        run: python -m compileall -q accounts campus_glimmer chat_messages listings
      - name: Django 系统检查
        run: python manage.py check
      - name: 数据库迁移检查
        run: python manage.py makemigrations --check --dry-run
      - name: 运行测试
        run: python manage.py test


  production-deps:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: campus_glimmer
          POSTGRES_USER: campus_glimmer
          POSTGRES_PASSWORD: ci-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus_glimmer -d campus_glimmer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: "0"
      DJANGO_REQUIRE_PRODUCTION_SERVICES: "0"
      DJANGO_SECRET_KEY: ci-only-production-dependency-test-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_DATABASE_URL: postgresql://campus_glimmer:ci-database-password@127.0.0.1:5432/campus_glimmer
      DJANGO_CACHE_URL: redis://127.0.0.1:6379/1
      DJANGO_CACHE_KEY_PREFIX: campus-glimmer-ci
      DJANGO_STORAGE_BACKEND: filesystem
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5
      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 收集静态文件
        run: python manage.py collectstatic --noinput
      - name: PostgreSQL 与 Redis 集成测试
        run: python manage.py test
