name: Django CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5
      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: Python 语法检查
        run: python -m compileall -q accounts campus_glimmer chat_messages listings
      - name: Django 系统检查
        run: python manage.py check
      - name: 数据库迁移检查
        run: python manage.py makemigrations --check --dry-run
      - name: 运行测试
        run: python manage.py test
