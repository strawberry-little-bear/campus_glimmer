<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">拾光校园系统架构图</title>
  <desc id="desc">展示 Django 应用、业务模块、数据存储、通知中心和运营看板之间的关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#eef8f3"/></linearGradient>
    <linearGradient id="app" x1="0" x2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#15304a" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#62819a"/></marker>
    <style>
      .heading{font:700 24px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#16324a}.label{font:600 17px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#16324a}.small{font:14px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#48667c}.white{font:700 18px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#fff}.line{stroke:#62819a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="60" y="62" class="heading">拾光校园 · 系统架构</text>
  <text x="60" y="91" class="small">以 Django 为核心，将交易、社区互动和运营分析接在同一条可回看的业务链路上</text>

  <g filter="url(#shadow)"><rect x="60" y="135" width="180" height="100" rx="18" fill="#fff" stroke="#b6d1e5"/><text x="150" y="175" text-anchor="middle" class="label">浏览器 / 移动端</text><text x="150" y="204" text-anchor="middle" class="small">模板页面 · 轻量 JS</text></g>
  <g filter="url(#shadow)"><rect x="340" y="115" width="300" height="140" rx="22" fill="url(#app)"/><text x="490" y="167" text-anchor="middle" class="white">Django 应用层</text><text x="490" y="198" text-anchor="middle" class="small" fill="#d9fffa">路由 · 视图 · 表单 · 权限 · 管理命令</text><text x="490" y="222" text-anchor="middle" class="small" fill="#d9fffa">通知刷新 · 运营聚合 · 测试</text></g>
  <g filter="url(#shadow)"><rect x="760" y="115" width="180" height="100" rx="18" fill="#fff" stroke="#b6d1e5"/><text x="850" y="155" text-anchor="middle" class="label">Django Admin</text><text x="850" y="184" text-anchor="middle" class="small">运营维护 · 人工复核</text></g>
  <g filter="url(#shadow)"><rect x="1000" y="115" width="140" height="100" rx="18" fill="#fff" stroke="#b6d1e5"/><text x="1070" y="155" text-anchor="middle" class="label">CI</text><text x="1070" y="184" text-anchor="middle" class="small">检查 · 测试</text></g>

  <line x1="240" y1="185" x2="340" y2="185" class="line"/><line x1="640" y1="185" x2="760" y2="165" class="line"/><line x1="940" y1="165" x2="1000" y2="165" class="line"/>

  <g filter="url(#shadow)"><rect x="60" y="330" width="220" height="160" rx="20" fill="#fff" stroke="#b6d1e5"/><text x="170" y="371" text-anchor="middle" class="label">交易域</text><text x="170" y="402" text-anchor="middle" class="small">商品 · 地点 · 搜索</text><text x="170" y="427" text-anchor="middle" class="small">订单 · 评价 · 收藏</text><text x="170" y="452" text-anchor="middle" class="small">预约 · 交付 · 争议</text></g>
  <g filter="url(#shadow)"><rect x="330" y="330" width="220" height="160" rx="20" fill="#fff" stroke="#b6d1e5"/><text x="440" y="371" text-anchor="middle" class="label">社区域</text><text x="440" y="402" text-anchor="middle" class="small">留言 · 私信 · 会话</text><text x="440" y="427" text-anchor="middle" class="small">未读提醒 · 活动中心</text><text x="440" y="452" text-anchor="middle" class="small">举报 · 内容审核</text></g>
  <g filter="url(#shadow)"><rect x="600" y="330" width="220" height="160" rx="20" fill="#fff" stroke="#b6d1e5"/><text x="710" y="371" text-anchor="middle" class="label">运营域</text><text x="710" y="402" text-anchor="middle" class="small">指标 · 漏斗 · 趋势</text><text x="710" y="427" text-anchor="middle" class="small">用户分层 · 回访率</text><text x="710" y="452" text-anchor="middle" class="small">搜索洞察 · 告警日报</text></g>
  <g filter="url(#shadow)"><rect x="870" y="330" width="270" height="160" rx="20" fill="#fff" stroke="#b6d1e5"/><text x="1005" y="371" text-anchor="middle" class="label">持久化与文件</text><text x="1005" y="402" text-anchor="middle" class="small">SQLite / 可替换 PostgreSQL</text><text x="1005" y="427" text-anchor="middle" class="small">媒体文件 · 商品图片 · 头像</text><text x="1005" y="452" text-anchor="middle" class="small">迁移 · 索引 · 约束</text></g>

  <line x1="440" y1="255" x2="170" y2="330" class="line"/><line x1="490" y1="255" x2="440" y2="330" class="line"/><line x1="540" y1="255" x2="710" y2="330" class="line"/><line x1="590" y1="245" x2="1005" y2="330" class="line"/>

  <g filter="url(#shadow)"><rect x="245" y="570" width="710" height="78" rx="20" fill="#173b56"/><text x="600" y="604" text-anchor="middle" class="white">可回看的业务事实</text><text x="600" y="630" text-anchor="middle" class="small" fill="#d9eaf6">搜索记录 · 浏览历史 · 订单事件 · 通知 · 举报 · 评价</text></g>
  <line x1="170" y1="490" x2="360" y2="570" class="line"/><line x1="440" y1="490" x2="500" y2="570" class="line"/><line x1="710" y1="490" x2="690" y2="570" class="line"/><line x1="1005" y1="490" x2="840" y2="570" class="line"/>
</svg>
