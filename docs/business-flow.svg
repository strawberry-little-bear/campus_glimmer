<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">拾光校园交易闭环</title>
  <desc id="desc">展示用户从发现商品到沟通、预约、交付确认和评价的校园交易流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fffaf2"/><stop offset="1" stop-color="#eff8ff"/></linearGradient>
    <linearGradient id="node" x1="0" x2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#15304a" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#698398"/></marker>
    <style>
      .heading{font:700 24px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#16324a}.label{font:700 17px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#16324a}.small{font:14px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#526d80}.number{font:700 15px 'Segoe UI',sans-serif;fill:#fff}.line{stroke:#698398;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="60" y="62" class="heading">校园交易闭环</text>
  <text x="60" y="91" class="small">从“看到一件商品”到“完成一次可回看的交易”，每一步都对应明确的业务状态</text>
  <g filter="url(#shadow)"><rect x="60" y="150" width="180" height="130" rx="22" fill="#fff" stroke="#f5c46c"/><circle cx="95" cy="185" r="16" fill="#f59e0b"/><text x="95" y="191" text-anchor="middle" class="number">1</text><text x="150" y="190" text-anchor="middle" class="label">发现</text><text x="150" y="225" text-anchor="middle" class="small">首页 · 分类 · 地点</text><text x="150" y="250" text-anchor="middle" class="small">搜索 · 推荐</text></g>
  <g filter="url(#shadow)"><rect x="285" y="150" width="180" height="130" rx="22" fill="#fff" stroke="#c8dba8"/><circle cx="320" cy="185" r="16" fill="#65a30d"/><text x="320" y="191" text-anchor="middle" class="number">2</text><text x="375" y="190" text-anchor="middle" class="label">了解</text><text x="375" y="225" text-anchor="middle" class="small">图片 · 描述 · 成色</text><text x="375" y="250" text-anchor="middle" class="small">卖家 · 地点 · 留言</text></g>
  <g filter="url(#shadow)"><rect x="510" y="150" width="180" height="130" rx="22" fill="#fff" stroke="#99cbd8"/><circle cx="545" cy="185" r="16" fill="#0891b2"/><text x="545" y="191" text-anchor="middle" class="number">3</text><text x="600" y="190" text-anchor="middle" class="label">沟通</text><text x="600" y="225" text-anchor="middle" class="small">公开留言</text><text x="600" y="250" text-anchor="middle" class="small">站内私信 · 议价</text></g>
  <g filter="url(#shadow)"><rect x="735" y="150" width="180" height="130" rx="22" fill="#fff" stroke="#a9bde5"/><circle cx="770" cy="185" r="16" fill="#2563eb"/><text x="770" y="191" text-anchor="middle" class="number">4</text><text x="825" y="190" text-anchor="middle" class="label">预约</text><text x="825" y="225" text-anchor="middle" class="small">状态校验 · 事务</text><text x="825" y="250" text-anchor="middle" class="small">订单事件 · 通知</text></g>
  <g filter="url(#shadow)"><rect x="960" y="150" width="180" height="130" rx="22" fill="#fff" stroke="#c3a9dd"/><circle cx="995" cy="185" r="16" fill="#7c3aed"/><text x="995" y="191" text-anchor="middle" class="number">5</text><text x="1050" y="190" text-anchor="middle" class="label">交付</text><text x="1050" y="225" text-anchor="middle" class="small">线下交接</text><text x="1050" y="250" text-anchor="middle" class="small">双方确认</text></g>
  <line x1="240" y1="215" x2="285" y2="215" class="line"/><line x1="465" y1="215" x2="510" y2="215" class="line"/><line x1="690" y1="215" x2="735" y2="215" class="line"/><line x1="915" y1="215" x2="960" y2="215" class="line"/>
  <g filter="url(#shadow)"><rect x="240" y="385" width="250" height="110" rx="20" fill="#173b56"/><text x="365" y="425" text-anchor="middle" fill="#fff" class="label">反馈与评价</text><text x="365" y="456" text-anchor="middle" fill="#d9eaf6" class="small">完成交易后留下评价</text><text x="365" y="478" text-anchor="middle" fill="#d9eaf6" class="small">异常时进入争议处理</text></g>
  <g filter="url(#shadow)"><rect x="710" y="385" width="250" height="110" rx="20" fill="#173b56"/><text x="835" y="425" text-anchor="middle" fill="#fff" class="label">运营与治理</text><text x="835" y="456" text-anchor="middle" fill="#d9eaf6" class="small">行为聚合 · 漏斗 · 告警</text><text x="835" y="478" text-anchor="middle" fill="#d9eaf6" class="small">举报 · 审核 · 日报</text></g>
  <path d="M1050 280 C1050 345 835 340 835 385" class="line"/><path d="M710 440 C620 540 470 540 365 495" class="line"/>
  <text x="600" y="570" text-anchor="middle" class="small">每一次行为都会尽量留下可追踪的记录，既服务当前用户，也为后续运营和产品迭代提供依据</text>
</svg>
