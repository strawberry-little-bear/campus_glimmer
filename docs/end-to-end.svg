<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
  <title id="title">拾光校园一条链路看全貌</title>
  <desc id="desc">左侧是学生能看见的动作，右侧是这些动作在看板上留下的痕迹，看板只读不写。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#eef8f3"/></linearGradient>
    <linearGradient id="app" x1="0" x2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <linearGradient id="node" x1="0" x2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#15304a" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#62819a"/></marker>
    <marker id="arrowd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7f9bb0"/></marker>
    <style>
      .heading{font:700 24px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#16324a}.label{font:600 17px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#16324a}.small{font:14px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#48667c}.white{font:700 18px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#fff}.faint{font:13px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#d9eaf6}.pill{font:700 15px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#fff}.line{stroke:#62819a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#7f9bb0;stroke-width:2;fill:none;stroke-dasharray:6 6;marker-end:url(#arrowd)}.entry{font:600 15px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#fff}.num{font:700 15px 'Segoe UI',sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="1200" height="880" rx="28" fill="url(#bg)"/>
  <text x="60" y="62" class="heading">拾光校园 · 一条链路看全貌</text>
  <text x="60" y="91" class="small">左侧是学生能看见的动作，右侧是这些动作在看板上留下的痕迹；看板只读不写，箭头只有一个方向</text>
  <g filter="url(#shadow)"><rect x="60" y="120" width="230" height="32" rx="16" fill="url(#app)" stroke="none"/></g>  <text x="175" y="141" text-anchor="middle" class="pill">学生能看见的动作</text>
  <g filter="url(#shadow)"><rect x="640" y="120" width="250" height="32" rx="16" fill="#173b56" stroke="none"/></g>  <text x="765" y="141" text-anchor="middle" class="pill">在看板上留下的痕迹</text>
  <g filter="url(#shadow)"><rect x="60" y="158" width="520" height="86" rx="20" fill="#fff" stroke="#b6d1e5"/></g>
  <text x="82" y="190" class="label">发布商品</text>
  <text x="82" y="216" class="small">出售 / 免费赠送 / 限期借用，三种交易方式各有独立的订单语义</text>
  <text x="82" y="236" class="small">可设展示截止时间、校园地点、成色与多图</text>
  <g filter="url(#shadow)"><rect x="60" y="256" width="520" height="86" rx="20" fill="#fff" stroke="#b6d1e5"/></g>
  <text x="82" y="288" class="label">发布求购与失物</text>
  <text x="82" y="314" class="small">求购按分类、地点、预算和关键词与新商品匹配，卖家可一键响应</text>
  <text x="82" y="334" class="small">失物招领按规则评分匹配，分数与依据对发布者可见</text>
  <g filter="url(#shadow)"><rect x="60" y="354" width="520" height="86" rx="20" fill="#fff" stroke="#b6d1e5"/></g>
  <text x="82" y="386" class="label">发现</text>
  <text x="82" y="412" class="small">搜索与联想、组合筛选、收藏与心愿单分组</text>
  <text x="82" y="432" class="small">首页推荐、互助机会流、关注搜索汇总提醒</text>
  <g filter="url(#shadow)"><rect x="60" y="452" width="520" height="86" rx="20" fill="#fff" stroke="#b6d1e5"/></g>
  <text x="82" y="484" class="label">沟通</text>
  <text x="82" y="510" class="small">商品留言、站内私信、失物私密线索</text>
  <text x="82" y="530" class="small">免费赠送的领取申请队列与撤回</text>
  <g filter="url(#shadow)"><rect x="60" y="550" width="520" height="86" rx="20" fill="#fff" stroke="#b6d1e5"/></g>
  <text x="82" y="582" class="label">预约与协商</text>
  <text x="82" y="608" class="small">创建时校验商品状态，事务与行级锁避免并发预约</text>
  <text x="82" y="628" class="small">交付时间与地点协商、改期、预约超时自动释放</text>
  <g filter="url(#shadow)"><rect x="60" y="648" width="520" height="86" rx="20" fill="#fff" stroke="#b6d1e5"/></g>
  <text x="82" y="680" class="label">交付与反馈</text>
  <text x="82" y="706" class="small">当面交付两次确认；借用归还两次握手与押金退回</text>
  <text x="82" y="726" class="small">评价、争议、举报，以及借用逾期的三级催收</text>
  <g filter="url(#shadow)"><rect x="640" y="158" width="520" height="576" rx="22" fill="#173b56"/></g>
  <text x="672" y="200" class="white">运营看板 · 只读聚合</text>
  <text x="672" y="226" class="faint">九组面板，各自回答一个问题</text>
  <circle cx="676" cy="257" r="5" fill="#38bdf8"/>
  <text x="696" y="262" class="entry">供给侧</text>
  <text x="696" y="282" class="faint">商品和卖家还在不在被维护</text>
  <circle cx="676" cy="299" r="5" fill="#a3e635"/>
  <text x="696" y="304" class="entry">需求雷达</text>
  <text x="696" y="324" class="faint">缺口被发现之后，有没有真的被补上</text>
  <circle cx="676" cy="341" r="5" fill="#fbbf24"/>
  <text x="696" y="346" class="entry">搜索洞察</text>
  <text x="696" y="366" class="faint">搜不到和搜到了不点，分别该改什么</text>
  <circle cx="676" cy="383" r="5" fill="#f472b6"/>
  <text x="696" y="388" class="entry">交付侧</text>
  <text x="696" y="408" class="faint">一次交易从心动到归还，卡在哪一段</text>
  <circle cx="676" cy="425" r="5" fill="#fb923c"/>
  <text x="696" y="430" class="entry">治理侧</text>
  <text x="696" y="450" class="faint">申诉、催收和用户自己按下的暂停键</text>
  <circle cx="676" cy="467" r="5" fill="#c084fc"/>
  <text x="696" y="472" class="entry">通知侧</text>
  <text x="696" y="492" class="faint">发出去的通知和私信，有没有被读到</text>
  <circle cx="676" cy="509" r="5" fill="#34d399"/>
  <text x="696" y="514" class="entry">推荐与个性化</text>
  <text x="696" y="534" class="faint">首页那几件东西，用户认不认</text>
  <circle cx="676" cy="551" r="5" fill="#60a5fa"/>
  <text x="696" y="556" class="entry">任务台账</text>
  <text x="696" y="576" class="faint">七个定时命令过去跑得怎么样</text>
  <circle cx="676" cy="593" r="5" fill="#f87171"/>
  <text x="696" y="598" class="entry">学期节律</text>
  <text x="696" y="618" class="faint">平均值换成阶段之后，屏幕和下载是否同一份</text>
  <line x1="672" y1="656" x2="1128" y2="656" stroke="#2f5b7c" stroke-width="1.5"/>
  <text x="672" y="686" class="faint">只报告，不改写任何业务状态；同一个对象在同一张表里口径一致</text>
  <line x1="580" y1="201" x2="634" y2="201" class="dash"/>
  <line x1="580" y1="299" x2="634" y2="299" class="dash"/>
  <line x1="580" y1="397" x2="634" y2="397" class="dash"/>
  <line x1="580" y1="495" x2="634" y2="495" class="dash"/>
  <line x1="580" y1="593" x2="634" y2="593" class="dash"/>
  <line x1="580" y1="691" x2="634" y2="691" class="dash"/>
  <g filter="url(#shadow)"><rect x="60" y="770" width="1100" height="76" rx="20" fill="#eef4f9" stroke="#b6d1e5"/></g>
  <text x="90" y="800" class="label">站内通知中心</text>
  <text x="90" y="824" class="small">25 个偏好开关 · 稍后处理 · 免打扰 · 已读时间 · 顶部未读定时刷新</text>
  <text x="640" y="800" class="label">治理工作台</text>
  <text x="640" y="824" class="small">举报 · 预约异常 · 借用催收升级 · 内容审核 · 用户临时静默</text>
</svg>
